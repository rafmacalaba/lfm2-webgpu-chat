<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFM2.5-2.6B — Browser Chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1115; color: #e6e8ee;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid #23262e; display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 15px; font-weight: 600; flex: 1; }
  #device-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 99px;
    background: #23262e; color: #9aa3b2;
  }
  #device-badge.gpu { background: #14321f; color: #4ade80; }
  #device-badge.wasm { background: #332a14; color: #fbbf24; }
  #log {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px;
         line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2b5cd9; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1c1f27; border-bottom-left-radius: 4px; }
  .msg.err { align-self: stretch; background: #331a1e; color: #f87171; font-size: 13px; }
  .msg.assistant.thinking::after {
    content: '…'; animation: pulse 1.2s infinite; display: inline-block;
  }
  @keyframes pulse { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  #gen-status { font-size: 11px; color: #9aa3b2; text-align: center; padding: 4px;
                min-height: 20px; }
  .msg.sys { align-self: stretch; background: none; color: #9aa3b2; font-size: 12px; text-align: center; }
  #load-panel {
    padding: 14px; border-top: 1px solid #23262e; font-size: 13px;
  }
  #load-panel .bar {
    height: 6px; background: #23262e; border-radius: 3px; margin: 8px 0;
    overflow: hidden;
  }
  #load-panel .bar > div { height: 100%; width: 0%; background: #4ade80; transition: width .2s; }
  #file-label { color: #9aa3b2; font-size: 12px; }
  form {
    display: flex; gap: 8px;
    padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid #23262e;
  }
  input[type=text] {
    flex: 1; background: #1c1f27; border: 1px solid #2c3040; color: #e6e8ee;
    border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none;
  }
  input[type=text]:focus { border-color: #4ade80; }
  button {
    background: #2b5cd9; border: none; color: #fff; border-radius: 12px;
    padding: 0 18px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  #stop-btn { background: #7f1d1d; display: none; }
  footer { font-size: 11px; color: #6b7280; padding: 0 14px 8px;
           padding-bottom: max(8px, env(safe-area-inset-bottom)); text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="model-title">Loading…</h1>
  <span id="device-badge">loading…</span>
</header>
<div id="log">
  <div class="msg sys" id="status">Downloading model (~1.5–1.9 GB, cached after first load)…</div>
</div>
<div id="load-panel">
  <div class="bar"><div id="bar-fill"></div></div>
  <div id="file-label">—</div>
</div>
<div id="gen-status"></div>
<form id="chat-form">
  <input type="text" id="prompt" placeholder="Loading model…" autocomplete="off" disabled>
  <button id="stop-btn" type="button">Stop</button>
  <button id="send-btn" type="submit" disabled>Send</button>
</form>
<footer>Runs 100% in your browser. Nothing leaves your device.</footer>

<script type="module">
import { pipeline, TextStreamer } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

// ponytail: ?model= and ?dtype= overrides for testing; drop when shipping
const PARAMS = new URLSearchParams(location.search);
const MODEL = PARAMS.get("model")
  || (IS_IOS ? "LiquidAI/LFM2.5-350M-ONNX" : "LiquidAI/LFM2.5-1.2B-Instruct-ONNX");
const MAX_NEW_TOKENS = 512;
const HISTORY_CAP = 12; // messages kept in context (KV cache size on mobile)

const $ = id => document.getElementById(id);
const log = $("log");
const badge = $("device-badge");

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

async function pickDevice() {
  // ponytail: iOS WebKit WebGPU (26+) hangs ORT session-create; force WASM until reliable
  if (IS_IOS || !navigator.gpu) return { device: "wasm", dtype: "q4", label: IS_IOS ? "WASM (iOS — WebGPU unreliable)" : "WASM (no WebGPU — slow)" };
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return { device: "wasm", dtype: "q4", label: "WASM (no GPU adapter)" };
    if (adapter.features && adapter.features.has("shader-f16"))
      return { device: "webgpu", dtype: "q4f16", label: "WebGPU fp16" };
    return { device: "webgpu", dtype: "q4", label: "WebGPU fp32" };
  } catch { return { device: "wasm", dtype: "q4", label: "WASM (adapter error)" }; }
}

// Try to keep the 1.5GB cache from being evicted
try { navigator.storage?.persist?.(); } catch {}

const sel = await pickDevice();
$("model-title").textContent = MODEL.split("/").pop().replace("-ONNX", "");
if (PARAMS.get("dtype")) sel.dtype = PARAMS.get("dtype");
badge.textContent = sel.label + (PARAMS.get("dtype") ? ` (forced ${sel.dtype})` : "");
badge.className = sel.device === "webgpu" ? "gpu" : "wasm";
if (sel.device === "wasm")
  addMsg("err", "⚠️ No WebGPU — falling back to WASM. Expect very slow generation on a phone. Android Chrome 121+ recommended.");

let generator = null;
try {
  generator = await pipeline("text-generation", MODEL, {
    device: sel.device,
    dtype: sel.dtype,
    progress_callback: p => {
      if (p.status === "progress" && p.total) {
        $("bar-fill").style.width = (p.progress || 0) + "%";
        $("file-label").textContent = `${p.file} — ${(p.progress || 0).toFixed(1)}%`;
      } else if (p.status === "done") {
        $("file-label").textContent = "Download complete — preparing engine…";
      } else if (p.status === "ready") {
        $("bar-fill").style.width = "100%";
        $("file-label").textContent = "Model ready";
        $("load-panel").style.display = "none";
        $("status").textContent = "Model ready. Cached for next visits.";
        $("gen-status").textContent = "";
        $("prompt").disabled = false;
        $("send-btn").disabled = false;
        $("prompt").placeholder = "Message…";
        $("prompt").focus();
      }
    },
  });
} catch (e) {
  $("status").textContent = "Model load failed";
  addMsg("err", "Load error: " + (e?.message || e) + (e?.stack ? "\n\n" + e.stack : ""));
  console.error("load failed", e);
  throw e;
}

let busy = false;
let interrupt = null;

$("stop-btn").addEventListener("click", () => interrupt?.());

$("chat-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (busy) return;
  const text = $("prompt").value.trim();
  if (!text) return;
  busy = true;
  $("prompt").value = "";
  $("prompt").disabled = true;
  $("send-btn").disabled = true;
  $("stop-btn").style.display = "";
  $("prompt").placeholder = "Generating… (Stop button cancels)";
  addMsg("user", text);

  const history = [...document.querySelectorAll(".msg.user, .msg.assistant")]
    .slice(-HISTORY_CAP)
    .map(el => ({ role: el.classList.contains("user") ? "user" : "assistant",
                  content: el.textContent }));
  const out = addMsg("assistant", "");
  out.classList.add("thinking");
  const t0 = Date.now();
  $("gen-status").textContent = sel.device === "webgpu"
    ? "Generating…"
    : "Generating on CPU (WASM) — first response can take 1–5 min on a phone…";
  interrupt = () => { generator?.interrupt(); };

  try {
    let acc = "";
    const streamer = new TextStreamer(generator.tokenizer, {
      skip_prompt: true,
      callback_function: t => {
        if (!acc) { out.classList.remove("thinking"); out.textContent = ""; }
        acc += t; out.textContent = acc;
        $("gen-status").textContent =
          `Generating… ${((Date.now()-t0)/1000).toFixed(0)}s`;
        log.scrollTop = log.scrollHeight;
      },
    });
    await generator(history, { max_new_tokens: MAX_NEW_TOKENS, do_sample: false, streamer });
    if (!acc) out.textContent = "(no output)";
  } catch (e) {
    out.className = "msg err";
    out.textContent = "Generation error: " + (e?.message || e);
  } finally {
    busy = false;
    interrupt = null;
    $("stop-btn").style.display = "none";
    $("gen-status").textContent = "";
    $("prompt").disabled = false;
    $("send-btn").disabled = false;
    $("prompt").placeholder = "Message…";
    $("prompt").focus();
  }
});
</script>
</body>
</html>
