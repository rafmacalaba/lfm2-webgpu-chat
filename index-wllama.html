<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFM2.5 Chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1115; color: #e6e8ee;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top));
    border-bottom: 1px solid #23262e; display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select {
    background: #1c1f27; color: #e6e8ee; border: 1px solid #2c3040;
    border-radius: 8px; padding: 4px 6px; font-size: 12px; max-width: 46%;
  }
  #log { flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px;
         line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2b5cd9; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1c1f27; border-bottom-left-radius: 4px; }
  .msg.err { align-self: stretch; background: #331a1e; color: #f87171; font-size: 13px; }
  .msg.sys { align-self: stretch; background: none; color: #9aa3b2; font-size: 12px; text-align: center; }
  .msg img { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 6px; display: block; }
  .msg.assistant.thinking::after { content: '…'; animation: pulse 1.2s infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  #load-panel { padding: 14px; border-top: 1px solid #23262e; font-size: 13px; }
  #load-panel .bar { height: 6px; background: #23262e; border-radius: 3px; margin: 8px 0; overflow: hidden; }
  #load-panel .bar > div { height: 100%; width: 0%; background: #4ade80; transition: width .2s; }
  #file-label { color: #9aa3b2; font-size: 12px; }
  #gen-status { font-size: 11px; color: #9aa3b2; text-align: center; padding: 4px; min-height: 20px; }
  form { display: flex; gap: 6px;
    padding: 8px 14px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid #23262e; align-items: center; }
  #attach-btn { background: #1c1f27; border: 1px solid #2c3040; border-radius: 10px;
    padding: 10px 12px; font-size: 16px; cursor: pointer; display: none; }
  #attach-btn.on { display: block; }
  input[type=text] {
    flex: 1; background: #1c1f27; border: 1px solid #2c3040; color: #e6e8ee;
    border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none; }
  input[type=text]:focus { border-color: #4ade80; }
  button { background: #2b5cd9; border: none; color: #fff; border-radius: 12px;
    padding: 0 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #stop-btn { background: #7f1d1d; display: none; }
  footer { font-size: 11px; color: #6b7280; padding: 0 14px 8px;
           padding-bottom: max(8px, env(safe-area-inset-bottom)); text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="model-title">Loading…</h1>
  <select id="model-select" title="Switch model (reloads page)">
    <option value="350m">350M text</option>
    <option value="vl450">VL-450M vision</option>
    <option value="agent12b">1.2B agent (tools)</option>
  </select>
</header>
<div id="log">
  <div class="msg sys" id="status">Downloading model…</div>
</div>
<div id="load-panel">
  <div class="bar"><div id="bar-fill"></div></div>
  <div id="file-label">—</div>
</div>
<div id="gen-status"></div>
<form id="chat-form">
  <input type="file" id="image-input" accept="image/*" capture="environment" hidden>
  <button id="attach-btn" type="button">📷</button>
  <input type="text" id="prompt" placeholder="Loading model…" autocomplete="off" disabled>
  <button id="stop-btn" type="button">Stop</button>
  <button id="send-btn" type="submit" disabled>Send</button>
</form>
<footer>Runs 100% in your browser. Nothing leaves your device.</footer>

<script type="module">
import { Wllama } from "./wllama/index.js";

// ponytail: unified single page; model via ?model= or header select
const MODELS = {
  "350m": {
    label: "LFM2.5-350M",
    hf: { repo: "LiquidAI/LFM2.5-350M-GGUF", quant: "Q4_K_M" },
    vision: false,
  },
  "vl450": {
    label: "LFM2.5-VL-450M",
    hf: { repo: "LiquidAI/LFM2.5-VL-450M-GGUF", quant: "Q4_0", mmprojQuant: "Q8_0" },
    vision: true,
  },
  "agent12b": {
    label: "LFM2.5-1.2B agent",
    hf: { repo: "LiquidAI/LFM2.5-1.2B-Instruct-GGUF", quant: "Q4_K_M" },
    vision: false,
    tools: true,
  },
};
const PARAMS = new URLSearchParams(location.search);
const KEY = MODELS[PARAMS.get("model")] ? PARAMS.get("model") : "350m";
const CFG = MODELS[KEY];
const N_CTX = 2048; // phone memory ceiling; raise on desktop
const MAX_TOKENS = 512;

// Agent tools — all CORS-friendly, no API keys, work from any origin.
const TOOLS = [
  { name: "wiki_search", description: "Search Wikipedia for facts about people, places, events, science.", parameters: { type: "object", properties: { query: { type: "string", description: "search terms" } }, required: ["query"] } },
  { name: "get_weather", description: "Current temperature, wind and conditions for a city.", parameters: { type: "object", properties: { location: { type: "string", description: "City, Country" } }, required: ["location"] } },
  { name: "calculate", description: "Evaluate a math expression.", parameters: { type: "object", properties: { expression: { type: "string", description: "e.g. (2+3)*7" } }, required: ["expression"] } },
  { name: "get_datetime", description: "Current local date and time of the device.", parameters: { type: "object", properties: {} } },
];
const SYS_AGENT = "You are a helpful assistant.";

const $ = id => document.getElementById(id);
const log = $("log");
$("model-title").textContent = CFG.label;
$("model-select").value = KEY;
$("model-select").addEventListener("change", e =>
  location.replace(location.pathname + "?model=" + e.target.value));

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (text) d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

const wllama = new Wllama({ default: "./wasm/wllama-main.wasm" });
wllama.setCompat({ wasm: "./wasm/wllama.wasm", worker: "./wasm/wllama.js" });

try {
  await wllama.loadModelFromHF(CFG.hf, {
    n_ctx: N_CTX,
    progressCallback: ({ loaded, total }) => {
      if (total) {
        const pct = loaded / total * 100;
        $("bar-fill").style.width = pct + "%";
        $("file-label").textContent = `Downloading — ${pct.toFixed(1)}% (${(loaded/1e6).toFixed(0)}/${(total/1e6).toFixed(0)} MB)`;
      }
    },
  });
  $("bar-fill").style.width = "100%";
  $("load-panel").style.display = "none";
  $("status").textContent = "Model ready. Cached for next visits.";
  $("prompt").disabled = false;
  $("send-btn").disabled = false;
  $("prompt").placeholder = CFG.vision ? "Message… (📷 attaches a photo)" : "Message…";
  if (CFG.vision) $("attach-btn").classList.add("on");
  $("prompt").focus();
} catch (e) {
  $("status").textContent = "Model load failed";
  addMsg("err", "Load error: " + (e?.message || e) + (e?.stack ? "\n\n" + e.stack.split("\n").slice(0, 6).join("\n") : ""));
  console.error("load failed", e);
  throw e;
}

const history = []; // {role, content} — content is string (text) or array (vision)
let busy = false;
let pendingImage = null; // { data: ArrayBuffer, url: string }
window.__cfg = CFG;
window.__gc = () => ({ historyLen: history.length,
  imageBufsLeft: history.filter(m => Array.isArray(m.content) && m.content.some(p => p.type === "image")).length });

// --- context garbage collector ---
// Images pinned in history are the killer: one 640px JPEG buffer is small, but
// N chats × image buffers + a history longer than n_ctx = tab death. So:
//   1. strip image data from every user message except the most recent
//   2. drop oldest messages when estimated tokens exceed the budget
const N_CTX_TOKENS = 2048;
const CTX_BUDGET = 1400; // leave headroom for the reply (ponytail: fixed budget; could read model n_ctx)
const estTokens = c =>
  Math.ceil((typeof c === "string" ? c : c.map(p => p.type === "text" ? p.text : "[photo]").join(" ")).length / 3.5);

function gcHistory() {
  // 1. free image buffers from all but the last user message
  for (let i = 0; i < history.length - 1; i++) {
    const m = history[i];
    if (Array.isArray(m.content)) {
      const txt = m.content.filter(p => p.type === "text").map(p => p.text).join(" ");
      m.content = (txt || "[photo]") + " [photo was shared]";
    }
  }
  // 2. drop oldest until under budget (always keep at least 1 exchange)
  let dropped = 0;
  let total = history.reduce((s, m) => s + estTokens(m.content), 0);
  while (history.length > 2 && total > CTX_BUDGET) {
    total -= estTokens(history[0].content);
    history.shift();
    dropped++;
  }
  if (dropped) addMsg("sys", `🧹 trimmed ${dropped} old message${dropped > 1 ? "s" : ""} to stay in context (~${total}/${N_CTX_TOKENS} tok)`);
  return total;
}

// --- image attach (only for vision models) ---
$("attach-btn").addEventListener("click", () => $("image-input").click());
$("image-input").addEventListener("change", async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  // Downscale to a small JPEG: iPhone photos are 12MP/3-5MB (and HEIC, which
  // llama.cpp can't decode). ~640px keeps vision quality, cuts memory ~40x.
  // ponytail: 640px ceiling; raise if detail tasks need more
  const MAX_DIM = 640;
  const img = await createImageBitmap(f);
  const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const canvas = new OffscreenCanvas(w, h);
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  const blob = await canvas.convertToBlob({ type: "image/jpeg", quality: 0.85 });
  const data = await blob.arrayBuffer();
  if (pendingImage?.url) URL.revokeObjectURL(pendingImage.url);
  pendingImage = { data, url: URL.createObjectURL(blob) };
  $("prompt").placeholder = "Photo attached — ask about it…";
});

$("stop-btn").addEventListener("click", () => { try { wllama.stopCompletion(); } catch {} });

async function runTool(name, args) {
  const j = r => r.ok ? r.json() : Promise.reject(new Error(r.status));
  try {
    if (name === "wiki_search") {
      const s = await j(await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(args.query)}&srlimit=2&format=json&origin=*`));
      const hits = s.query?.search || [];
      if (!hits.length) return { result: "no hits" };
      const page = hits[0];
      const sum = await j(await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(page.title)));
      return { title: page.title, summary: sum.extract || "", snippet: page.snippet?.replace(/<[^>]+>/g, "") };
    }
    if (name === "get_weather") {
      const g = await j(await fetch("https://nominatim.openstreetmap.org/search?q=" + encodeURIComponent(args.location) + "&format=json&limit=1"));
      if (!g.length) return { error: "location not found" };
      const { lat, lon, display_name } = g[0];
      const w = await j(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`));
      const codes = {0:"clear",1:"mostly clear",2:"partly cloudy",3:"overcast",45:"fog",48:"rime fog",51:"light drizzle",53:"drizzle",61:"rain",63:"rain",65:"heavy rain",71:"snow",73:"snow",75:"heavy snow",80:"rain showers",81:"showers",82:"violent showers",95:"thunderstorm",96:"thunderstorm+hail",99:"thunderstorm+hail"};
      const c = w.current || {};
      return { location: display_name, temperature_c: c.temperature_2m, weather: codes[c.weather_code] || "unknown", wind_kmh: c.wind_speed_10m };
    }
    if (name === "calculate") {
      if (!/^[-+*/%().\d\s^e]+$/i.test(args.expression)) return { error: "expression contains unsupported characters" };
      const val = Function('"use strict";return (' + args.expression.replace(/\^/g, "**") + ")")();
      return { expression: args.expression, result: val };
    }
    if (name === "get_datetime") return { datetime: new Date().toString() };
    return { error: "unknown tool " + name };
  } catch (e) { return { error: String(e?.message || e) }; }
}

// one agent turn: createChatCompletion with native tool calling → execute → loop (≤3 rounds)
async function agentGenerate(display, t0) {
  let finalText = "";
  for (let round = 0; round < 3; round++) {
    let content = "", toolCalls = [];
    const stream = await wllama.createChatCompletion({
      messages: history,
      tools: TOOLS,
      max_tokens: round === 2 ? MAX_TOKENS : 300,
      temperature: 0.2,
      stream: true,
    });
    for await (const chunk of stream) {
      const d = chunk.choices[0]?.delta;
      if (d?.content) {
        if (!content) display.classList.remove("thinking");
        content += d.content;
        display.textContent = content;
        $("gen-status").textContent = `Generating… ${((Date.now()-t0)/1000).toFixed(0)}s`;
        log.scrollTop = log.scrollHeight;
      }
      if (d?.tool_calls) for (const tc of d.tool_calls) {
        const i = tc.index ?? 0;
        toolCalls[i] ??= { name: "", args: "" };
        if (tc.function?.name) toolCalls[i].name += tc.function.name;
        if (tc.function?.arguments) toolCalls[i].args += tc.function.arguments;
      }
    }
    if (!toolCalls.length) { finalText = content; break; }
    display.classList.add("thinking");
    const parsed = toolCalls.map(tc => {
      let args = {};
      try { args = JSON.parse(tc.args || "{}"); } catch {}
      return { name: tc.name, args };
    });
    for (const c of parsed) addMsg("sys", "🔧 " + c.name + "(" + JSON.stringify(c.args).slice(1, -1) + ")");
    history.push({ role: "assistant", content: content || null,
      tool_calls: parsed.map((c, i) => ({ id: "call_" + i, type: "function",
        function: { name: c.name, arguments: JSON.stringify(c.args) } })) });
    for (let i = 0; i < parsed.length; i++) {
      const r = await runTool(parsed[i].name, parsed[i].args);
      addMsg("sys", "↩︎ " + JSON.stringify(r).slice(0, 140) + (JSON.stringify(r).length > 140 ? "…" : ""));
      history.push({ role: "tool", content: JSON.stringify(r).slice(0, 2000), tool_call_id: "call_" + i });
    }
    gcHistory();
  }
  return finalText;
}

$("chat-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (busy) return;
  const text = $("prompt").value.trim();
  if (!text && !pendingImage) return;
  busy = true;
  $("prompt").value = "";
  $("prompt").disabled = true;
  $("send-btn").disabled = true;
  $("stop-btn").style.display = "";
  $("prompt").placeholder = "Generating… (Stop cancels)";

  // user bubble (with photo thumbnail if attached)
  const bubble = addMsg("user", text);
  let content;
  if (pendingImage) {
    const img = document.createElement("img");
    img.src = pendingImage.url;
    bubble.appendChild(img);
    content = [{ type: "image", data: pendingImage.data }, { type: "text", text }];
    $("prompt").placeholder = "Message… (📷 attaches a photo)";
    pendingImage = null;
  } else {
    content = text;
  }
  history.push({ role: "user", content });
  if (CFG.tools && history[0]?.role !== "system")
    history.unshift({ role: "system", content: SYS_AGENT });
  gcHistory();

  const out = addMsg("assistant", "");
  out.classList.add("thinking");
  const t0 = Date.now();
  $("gen-status").textContent = CFG.vision && history.length <= 2
    ? "Encoding image on CPU — this can take a while on a phone…"
    : "Generating on CPU…";

  let acc = "";
  try {
    if (CFG.tools) {
      try {
        acc = await agentGenerate(out);
      } catch (toolErr) {
        // wllama 3.6.1 GLUE bug: chat completion + tools crashes on text models.
        // ponytail: drop fallback when wllama fixes it
        addMsg("sys", "⚠️ tool engine unavailable — answering without tools");
        for (let i = history.length - 1; i >= 0; i--)
          if (history[i].role === "tool") history.splice(i, 1);
        history.push({ role: "assistant", content: "" }); // placeholder replaced below
        acc = "";
        const plain = history.filter(m => m.role !== "assistant" || m.content);
        await wllama.createCompletion({
          prompt: (() => { let p = "<|startoftext|>"; for (const m of plain) { const c = typeof m.content === "string" ? m.content : m.content.map(x => x.text || "").join(" "); p += `${m.role}\n${c}\n`; } return p + "assistant\n"; })(),
          max_tokens: MAX_TOKENS, temperature: 0.3, top_p: 0.9,
          stop: ["\nuser\n", "\ntool\n"], stream: true,
          onData: chunk => {
            acc += chunk.choices[0].text;
            out.textContent = acc;
            log.scrollTop = log.scrollHeight;
          },
        }).catch(() => {});
        history.pop(); // remove the placeholder assistant msg; final push happens below
        acc = acc.trim();
      }
      if (!acc) out.textContent = "(no output)";
    } else if (CFG.vision) {
      const stream = await wllama.createChatCompletion({
        messages: history,
        max_tokens: MAX_TOKENS,
        temperature: 0.2,
        stream: true,
      });
      for await (const chunk of stream) {
        const t = chunk.choices[0]?.delta?.content;
        if (!t) continue;
        if (!acc) out.classList.remove("thinking");
        acc += t;
        out.textContent = acc;
        $("gen-status").textContent = `Generating… ${((Date.now()-t0)/1000).toFixed(0)}s`;
        log.scrollTop = log.scrollHeight;
      }
    } else {
      // createChatCompletion crashes in wllama 3.6.1 for text models (GLUE
      // readback bug) — raw completion with hand-rolled LFM2.5 template.
      // ponytail: revisit when wllama ships a fix
      let prompt = "<|startoftext|>";
      for (const m of history) {
        const c = typeof m.content === "string" ? m.content : m.content.map(p => p.text || "").join(" ");
        prompt += `${m.role}\n${c}\n`;
      }
      prompt += "assistant\n";
      await wllama.createCompletion({
        prompt,
        max_tokens: MAX_TOKENS,
        temperature: 0.3,
        top_p: 0.9,
        stop: ["\nuser\n", "<|endof"],
        stream: true,
        onData: chunk => {
          const t = chunk.choices[0].text;
          if (!acc) out.classList.remove("thinking");
          acc += t;
          out.textContent = acc;
          $("gen-status").textContent = `Generating… ${((Date.now()-t0)/1000).toFixed(0)}s`;
          log.scrollTop = log.scrollHeight;
        },
      });
    }
    if (!acc) out.textContent = "(no output)";
    history.push({ role: "assistant", content: acc });
    gcHistory();
  } catch (e) {
    out.className = "msg err";
    out.textContent = "Generation error: " + (e?.message || e) + (e?.stack ? "\n" + e.stack.split("\n").slice(0, 6).join("\n") : "");
  } finally {
    busy = false;
    $("stop-btn").style.display = "none";
    $("gen-status").textContent = "";
    $("prompt").disabled = false;
    $("send-btn").disabled = false;
    $("prompt").placeholder = "Message…";
    $("prompt").focus();
  }
});
</script>
</body>
</html>
