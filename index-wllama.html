<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFM2.5-350M — Browser Chat (llama.cpp)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1115; color: #e6e8ee;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid #23262e; display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 15px; font-weight: 600; flex: 1; }
  #device-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 99px;
    background: #23262e; color: #9aa3b2;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px;
         line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2b5cd9; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1c1f27; border-bottom-left-radius: 4px; }
  .msg.err { align-self: stretch; background: #331a1e; color: #f87171; font-size: 13px; }
  .msg.sys { align-self: stretch; background: none; color: #9aa3b2; font-size: 12px; text-align: center; }
  #load-panel { padding: 14px; border-top: 1px solid #23262e; font-size: 13px; }
  #load-panel .bar {
    height: 6px; background: #23262e; border-radius: 3px; margin: 8px 0; overflow: hidden;
  }
  #load-panel .bar > div { height: 100%; width: 0%; background: #4ade80; transition: width .2s; }
  #file-label { color: #9aa3b2; font-size: 12px; }
  #gen-status { font-size: 11px; color: #9aa3b2; text-align: center; padding: 4px; min-height: 20px; }
  form {
    display: flex; gap: 8px;
    padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid #23262e;
  }
  input[type=text] {
    flex: 1; background: #1c1f27; border: 1px solid #2c3040; color: #e6e8ee;
    border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none;
  }
  input[type=text]:focus { border-color: #4ade80; }
  button {
    background: #2b5cd9; border: none; color: #fff; border-radius: 12px;
    padding: 0 18px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  #stop-btn { background: #7f1d1d; display: none; }
  footer { font-size: 11px; color: #6b7280; padding: 0 14px 8px;
           padding-bottom: max(8px, env(safe-area-inset-bottom)); text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="model-title">Loading…</h1>
  <span id="device-badge">loading…</span>
</header>
<div id="log">
  <div class="msg sys" id="status">Downloading model (~250 MB, cached after first load)…</div>
</div>
<div id="load-panel">
  <div class="bar"><div id="bar-fill"></div></div>
  <div id="file-label">—</div>
</div>
<div id="gen-status"></div>
<form id="chat-form">
  <input type="text" id="prompt" placeholder="Loading model…" autocomplete="off" disabled>
  <button id="stop-btn" type="button">Stop</button>
  <button id="send-btn" type="submit" disabled>Send</button>
</form>
<footer>Runs 100% in your browser (llama.cpp/WebAssembly). Nothing leaves your device.</footer>

<script type="module">
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/index.js";

const GGUF = "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/main/LFM2.5-350M-Q4_K_M.gguf";
const N_CTX = 2048; // ponytail: keep context small — phone memory ceiling, raise on desktop
const MAX_TOKENS = 512;

const $ = id => document.getElementById(id);
const log = $("log");
$("model-title").textContent = "LFM2.5-350M (GGUF)";

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

const wllama = new Wllama({
  default: "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/wasm/wllama.wasm",
});
wllama.setCompat("default"); // Safari/old browsers get compat build from CDN automatically
$("device-badge").textContent = "llama.cpp WASM";

try {
  await wllama.loadModelFromUrl(GGUF, {
    n_ctx: N_CTX,
    progressCallback: p => {
      // handle both ({loaded,total}) and (loaded, total) callback shapes
      const { loaded = p, total } = p?.loaded !== undefined ? p : { loaded: arguments[1], total: arguments[2] };
      if (total) {
        const pct = (loaded / total * 100);
        $("bar-fill").style.width = pct + "%";
        $("file-label").textContent = `LFM2.5-350M-Q4_K_M.gguf — ${pct.toFixed(1)}% (${(loaded/1e6).toFixed(0)}/${(total/1e6).toFixed(0)} MB)`;
      }
    },
  });
  $("bar-fill").style.width = "100%";
  $("load-panel").style.display = "none";
  $("status").textContent = "Model ready. Cached for next visits.";
  $("prompt").disabled = false;
  $("send-btn").disabled = false;
  $("prompt").placeholder = "Message…";
} catch (e) {
  $("status").textContent = "Model load failed";
  addMsg("err", "Load error: " + (e?.message || e) + (e?.stack ? "\n\n" + e.stack : ""));
  console.error("load failed", e);
  throw e;
}

const history = [];
let busy = false;

$("stop-btn").addEventListener("click", () => { try { wllama.stopCompletion(); } catch {} });

$("chat-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (busy) return;
  const text = $("prompt").value.trim();
  if (!text) return;
  busy = true;
  $("prompt").value = "";
  $("prompt").disabled = true;
  $("send-btn").disabled = true;
  $("stop-btn").style.display = "";
  $("prompt").placeholder = "Generating… (Stop button cancels)";
  addMsg("user", text);

  history.push({ role: "user", content: text });
  if (history.length > 12) history.splice(0, history.length - 12);

  const out = addMsg("assistant", "");
  out.classList.add("thinking");
  const t0 = Date.now();
  $("gen-status").textContent = "Generating on CPU — first response can take a minute on a phone…";

  try {
    let acc = "";
    // createChatCompletion crashes in wllama 3.6.1 (GLUE readback bug); use raw
    // createCompletion with the LFM2.5 template hand-rolled.
    let prompt = "<|startoftext|>";
    for (const m of history) prompt += `${m.role}\n${m.content}\n`;
    prompt += "assistant\n";
    await wllama.createCompletion({
      prompt,
      max_tokens: MAX_TOKENS,
      temperature: 0.3,
      top_p: 0.9,
      stop: ["\nuser\n", "<|endof"],
      stream: true,
      onData: chunk => {
        const t = chunk.choices[0].text;
        if (!acc) { out.classList.remove("thinking"); }
        acc += t;
        out.textContent = acc;
        $("gen-status").textContent = `Generating… ${((Date.now()-t0)/1000).toFixed(0)}s`;
        log.scrollTop = log.scrollHeight;
      },
    });
    if (!acc) out.textContent = "(no output)";
    history.push({ role: "assistant", content: acc });
  } catch (e) {
    out.className = "msg err";
    out.textContent = "Generation error: " + (e?.message || e);
  } finally {
    busy = false;
    $("stop-btn").style.display = "none";
    $("gen-status").textContent = "";
    $("prompt").disabled = false;
    $("send-btn").disabled = false;
    $("prompt").placeholder = "Message…";
    $("prompt").focus();
  }
});
</script>
</body>
</html>
